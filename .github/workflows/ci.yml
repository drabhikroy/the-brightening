name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out and building needs nothing but read access. Stating that here
# means a pull request from a fork cannot borrow a wider default token.
permissions:
  contents: read

jobs:
  writing:
    name: House writing rules
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than a moving tag, which whoever controls the
      # action repository could repoint at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the writing rules
        run: python3 Scripts/standards_gate.py

  app:
    name: App build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same compiler call build.sh makes, without signing or the icon.
      # A change that fails to compile, or adds a warning, fails here rather
      # than on release day.
      - name: Compile the app
        run: |
          set -euo pipefail
          xcrun swiftc -warnings-as-errors Sources/*.swift \
            -framework AppKit -framework CoreGraphics -framework Metal \
            -framework QuartzCore -framework ServiceManagement \
            -o "$RUNNER_TEMP/TheBrightening"

      - name: Check the shell scripts
        run: |
          set -euo pipefail
          for script in build.sh build-installer.sh Scripts/compare.sh Installer/preinstall Installer/postinstall; do
            zsh -n "$script"
          done
